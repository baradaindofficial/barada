<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" fill="none" role="img" aria-label="Illustration of a learning dashboard and a growth chart, representing Barada Academy courses and Partnerschaft execution" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F8"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E31E24"/>
      <stop offset="100%" stop-color="#FF5A5F"/>
    </linearGradient>
  </defs>

  <!-- back glow -->
  <circle cx="300" cy="230" r="220" fill="#1A2B5E" opacity="0.35"/>

  <!-- main dashboard card -->
  <g>
    <rect x="70" y="90" width="340" height="300" rx="20" fill="url(#cardGrad)" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- window dots -->
    <circle cx="100" cy="118" r="5" fill="#E31E24"/>
    <circle cx="118" cy="118" r="5" fill="#D4AF37"/>
    <circle cx="136" cy="118" r="5" fill="#0D183D" opacity="0.4"/>

    <!-- title bar -->
    <rect x="96" y="140" width="160" height="12" rx="6" fill="#0D183D"/>
    <rect x="96" y="160" width="100" height="8" rx="4" fill="#9CA3AF"/>

    <!-- progress rows -->
    <g>
      <rect x="96" y="190" width="220" height="10" rx="5" fill="#E5E7EB"/>
      <rect x="96" y="190" width="170" height="10" rx="5" fill="#D4AF37"/>

      <rect x="96" y="214" width="220" height="10" rx="5" fill="#E5E7EB"/>
      <rect x="96" y="214" width="120" height="10" rx="5" fill="#E31E24"/>

      <rect x="96" y="238" width="220" height="10" rx="5" fill="#E5E7EB"/>
      <rect x="96" y="238" width="200" height="10" rx="5" fill="#0D183D"/>
    </g>

    <!-- bar chart -->
    <g>
      <rect x="96" y="320" width="26" height="46" rx="4" fill="url(#barGrad)"/>
      <rect x="132" y="296" width="26" height="70" rx="4" fill="#0D183D"/>
      <rect x="168" y="276" width="26" height="90" rx="4" fill="#D4AF37"/>
      <rect x="204" y="256" width="26" height="110" rx="4" fill="url(#barGrad)"/>
      <rect x="240" y="306" width="26" height="60" rx="4" fill="#0D183D" opacity="0.75"/>
    </g>

    <!-- certificate chip -->
    <g>
      <rect x="290" y="190" width="100" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
      <circle cx="340" cy="228" r="20" fill="none" stroke="#D4AF37" stroke-width="4"/>
      <path d="M332 228 l6 7 l12 -16" stroke="#0D183D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="306" y="262" width="68" height="8" rx="4" fill="#9CA3AF"/>
      <rect x="316" y="278" width="48" height="8" rx="4" fill="#E5E7EB"/>
    </g>
  </g>

  <!-- floating badge: academy (graduation cap) -->
  <g>
    <circle cx="90" cy="60" r="34" fill="#E31E24"/>
    <g transform="translate(90,60)">
      <path d="M-20 -6 L0 -16 L20 -6 L0 4 Z" fill="#FFFFFF"/>
      <path d="M-10 -1 L-10 10 Q0 17 10 10 L10 -1" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="16" y1="-4" x2="16" y2="9" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- floating badge: link / partnerschaft (chain) -->
  <g>
    <circle cx="470" cy="150" r="30" fill="#0D183D"/>
    <g transform="translate(470,150)" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round">
      <rect x="-13" y="-7" width="16" height="14" rx="7" transform="rotate(-45)"/>
      <rect x="-3" y="-7" width="16" height="14" rx="7" transform="rotate(-45)"/>
    </g>
  </g>

  <!-- floating badge: growth (arrow chart) -->
  <g>
    <circle cx="450" cy="340" r="30" fill="#D4AF37"/>
    <g transform="translate(450,340)" stroke="#0D183D" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-14,8 -4,-2 4,4 14,-10"/>
      <polyline points="6,-10 14,-10 14,-2"/>
    </g>
  </g>

  <!-- floating small dots -->
  <circle cx="60" cy="300" r="6" fill="#D4AF37"/>
  <circle cx="420" cy="60" r="5" fill="#E31E24"/>
  <circle cx="500" cy="260" r="4" fill="#FFFFFF" opacity="0.6"/>
</svg>
